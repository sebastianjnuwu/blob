
name: CI/CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -d .
            exit 1
          fi

      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - run: go test -race $(go list ./... | grep -v '/tests/e2e')

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build binary with version
        env:
          CGO_ENABLED: 0
        run: |
          VERSION=$(date +"%Y-%m-%d_%H:%M")
          go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" -o blob
          echo "Built version: $VERSION"
          ls -lh blob

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u sebastianjnuwu --password-stdin

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/sebastianjnuwu/blob:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Blob
        uses: sebastianjnuwu/ssh-action-deploy@v5
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/sebastianjnuwu/blob:latest

            docker rm -f blob 2>/dev/null || true

            mkdir -p /services/data/blob/uploads

            docker create \
              --name blob \
              --init \
              --restart always \
              --network app \
              -v /services/data/blob/uploads:/services/data/blob/uploads \
              -e BLOB_URL='${{ secrets.BLOB_URL }}' \
              -e BLOB_API_KEY='${{ secrets.BLOB_API_KEY }}' \
              -e PORT='${{ secrets.PORT }}' \
              -e HOST='${{ secrets.HOST }}' \
              -e BLOB_DATABASE_URL='${{ secrets.BLOB_DATABASE_URL }}' \
              -e REDIS_URL='${{ secrets.REDIS_URL }}' \
              -e BLOB_STORAGE_PATH='${{ secrets.BLOB_STORAGE_PATH }}' \
              -e BLOB_PUBLIC_URL='${{ secrets.BLOB_PUBLIC_URL }}' \
              -e BLOB_SIGNED_URL_TTL='${{ secrets.BLOB_SIGNED_URL_TTL }}' \
              -e BLOB_HASH_FALLBACK_ENABLED='${{ secrets.BLOB_HASH_FALLBACK_ENABLED }}' \
              -e BLOB_TRUST_PROXY='${{ secrets.BLOB_TRUST_PROXY }}' \
              -e BLOB_DEDUP_ENABLED='${{ secrets.BLOB_DEDUP_ENABLED }}' \
              -e BLOB_RATE_LIMIT_MAX='${{ secrets.BLOB_RATE_LIMIT_MAX }}' \
              -e BLOB_RATE_LIMIT_WINDOW_MS='${{ secrets.BLOB_RATE_LIMIT_WINDOW_MS }}' \
              -e BLOB_ALLOWED_MIME_TYPES='${{ secrets.BLOB_ALLOWED_MIME_TYPES }}' \
              -e BLOB_MIN_CHUNK_SIZE='${{ secrets.BLOB_MIN_CHUNK_SIZE }}' \
              -e BLOB_MAX_CHUNK_SIZE='${{ secrets.BLOB_MAX_CHUNK_SIZE }}' \
              -e BLOB_MAX_UPLOAD_SIZE_BYTES='${{ secrets.BLOB_MAX_UPLOAD_SIZE_BYTES }}' \
              -e BLOB_MAX_STORAGE_SIZE='${{ secrets.BLOB_MAX_STORAGE_SIZE }}' \
              -e BLOB_EXPIRED_CLEANUP_INTERVAL='${{ secrets.BLOB_EXPIRED_CLEANUP_INTERVAL }}' \
              -e BLOB_TMP_CLEANUP_INTERVAL='${{ secrets.BLOB_TMP_CLEANUP_INTERVAL }}' \
              -e BLOB_TMP_CLEANUP_THRESHOLD='${{ secrets.BLOB_TMP_CLEANUP_THRESHOLD }}' \
              -e BLOB_CORS_ORIGINS='${{ secrets.BLOB_CORS_ORIGINS }}' \
              ghcr.io/sebastianjnuwu/blob:latest

            docker network connect data blob

            docker start blob
