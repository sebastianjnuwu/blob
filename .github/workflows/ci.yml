name: CI

on:
  push:
    branches: [production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Run Go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Tests
        run: go test -race $(go list ./... | grep -v '/tests/e2e')

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: sebastianjnuwu
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/production' }}
          tags: ghcr.io/sebastianjnuwu/blob:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-24.04
    needs: [format, lint, test, build]
    if: ${{ github.ref == 'refs/heads/production' }}
    steps:
      - name: Deploy Blob
        uses: sebastianjnuwu/ssh-action-deploy@v5
        with:
          IP: ${{ secrets.VPS_SSH_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          USER: ${{ secrets.VPS_SSH_USER }}
          RUN: |
            set -eu

            docker network inspect app >/dev/null
            docker network inspect data >/dev/null
            docker volume inspect files-data >/dev/null

            docker pull ghcr.io/sebastianjnuwu/blob:latest

            docker stop blob || true
            docker rm blob || true

            docker create \
              --name blob \
              --init \
              --restart always \
              --network app \
              --network-alias blob \
              --security-opt no-new-privileges:true \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --mount type=volume,source=files-data,target=/services/data/blob \
              -e BLOB_URL='${{ secrets.BLOB_URL }}' \
              -e BLOB_API_KEY='${{ secrets.BLOB_API_KEY }}' \
              -e PORT='${{ secrets.PORT }}' \
              -e HOST='${{ secrets.HOST }}' \
              -e BLOB_DATABASE_URL='${{ secrets.BLOB_DATABASE_URL }}' \
              -e REDIS_URL='${{ secrets.REDIS_URL }}' \
              -e BLOB_STORAGE_PATH='${{ secrets.BLOB_STORAGE_PATH }}' \
              -e BLOB_PUBLIC_URL='${{ secrets.BLOB_PUBLIC_URL }}' \
              -e BLOB_SIGNED_URL_TTL='${{ secrets.BLOB_SIGNED_URL_TTL }}' \
              -e BLOB_HASH_FALLBACK_ENABLED='${{ secrets.BLOB_HASH_FALLBACK_ENABLED }}' \
              -e BLOB_TRUST_PROXY='${{ secrets.BLOB_TRUST_PROXY }}' \
              -e BLOB_DEDUP_ENABLED='${{ secrets.BLOB_DEDUP_ENABLED }}' \
              -e BLOB_RATE_LIMIT_MAX='${{ secrets.BLOB_RATE_LIMIT_MAX }}' \
              -e BLOB_RATE_LIMIT_WINDOW_MS='${{ secrets.BLOB_RATE_LIMIT_WINDOW_MS }}' \
              -e BLOB_ALLOWED_MIME_TYPES='${{ secrets.BLOB_ALLOWED_MIME_TYPES }}' \
              -e BLOB_MIN_CHUNK_SIZE='${{ secrets.BLOB_MIN_CHUNK_SIZE }}' \
              -e BLOB_MAX_CHUNK_SIZE='${{ secrets.BLOB_MAX_CHUNK_SIZE }}' \
              -e BLOB_MAX_UPLOAD_SIZE_BYTES='${{ secrets.BLOB_MAX_UPLOAD_SIZE_BYTES }}' \
              -e BLOB_MAX_STORAGE_SIZE='${{ secrets.BLOB_MAX_STORAGE_SIZE }}' \
              -e BLOB_EXPIRED_CLEANUP_INTERVAL='${{ secrets.BLOB_EXPIRED_CLEANUP_INTERVAL }}' \
              -e BLOB_TMP_CLEANUP_INTERVAL='${{ secrets.BLOB_TMP_CLEANUP_INTERVAL }}' \
              -e BLOB_TMP_CLEANUP_THRESHOLD='${{ secrets.BLOB_TMP_CLEANUP_THRESHOLD }}' \
              -e BLOB_CORS_ORIGINS='${{ secrets.BLOB_CORS_ORIGINS }}' \
              ghcr.io/sebastianjnuwu/blob:latest

            docker network connect data blob

            docker start blob

            echo "Blob deployed successfully"
