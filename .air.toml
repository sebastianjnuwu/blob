root = "."
tmp_dir = "tmp"
testdata_dir = "testdata"

[build]
cmd = "go build -o ./tmp/main.exe ."
bin = "./tmp/main.exe"
full_bin = ""
pre_cmd = []
post_cmd = []
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["examples", "storage", "files", "tmp", "node_modules", "assets", "testdata"]
exclude_regex = ["_test.go"]
exclude_unchanged = true
follow_symlink = false
log = "build-errors.log"
send_interrupt = false
stop_on_error = true
delay = 1000

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = false
